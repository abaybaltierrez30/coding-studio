<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0b0b12;
        --red-main: #ff2a2a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg-dark);
        color: #fff;
        text-align: center;
        font-family: Helvetica, Arial, sans-serif;
      }

      .bg {
        position: absolute;
        inset: -10%;
        overflow: hidden;
        z-index: 0;
      }

      .orb {
        position: absolute;
        border-radius: 42% 58% 55% 45% / 46% 44% 56% 54%;
        opacity: 0.88;
        box-shadow:
          inset 0 0 45px rgba(255,255,255,0.38),
          inset 0 -20px 40px rgba(255,255,255,0.12),
          0 28px 55px rgba(0,0,0,0.24),
          0 0 35px rgba(255,255,255,0.18);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.22);
        animation: drift linear infinite alternate;
      }

      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(1.18) rotate(18deg);
        }
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }

      h1 {
        font-family: Helvetica, Arial, sans-serif;
        color: var(--red-main);
        font-size: 2.5rem;
        margin: 0;
      }

      p {
        font-family: "Source Sans 3", "Source Sans", Arial, sans-serif;
        font-size: 1.2rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb" style="left: -8%; top: -12%; width: 760px; height: 760px; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 86, 86, 0.82) 25%, rgba(255, 30, 30, 0.35) 58%, rgba(255, 0, 102, 0.12) 100%); --dx: 220px; --dy: 200px; animation-duration: 24s; animation-delay: 0s;"></div>
      <div class="orb" style="left: 16%; top: 58%; width: 700px; height: 700px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(94, 255, 251, 0.82) 22%, rgba(0, 212, 255, 0.38) 60%, rgba(36, 87, 255, 0.12) 100%); --dx: -170px; --dy: -220px; animation-duration: 28s; animation-delay: 1.2s;"></div>
      <div class="orb" style="left: 38%; top: -18%; width: 820px; height: 820px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.92), rgba(151, 255, 110, 0.8) 22%, rgba(48, 255, 136, 0.36) 58%, rgba(0, 194, 120, 0.12) 100%); --dx: -240px; --dy: 210px; animation-duration: 32s; animation-delay: 2.1s;"></div>
      <div class="orb" style="left: 54%; top: 48%; width: 760px; height: 760px; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.95), rgba(255, 222, 85, 0.82) 24%, rgba(255, 160, 0, 0.38) 60%, rgba(255, 98, 0, 0.12) 100%); --dx: 200px; --dy: -240px; animation-duration: 26s; animation-delay: 0.8s;"></div>
      <div class="orb" style="left: 70%; top: -8%; width: 720px; height: 720px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(220, 150, 255, 0.8) 22%, rgba(175, 92, 255, 0.35) 60%, rgba(100, 0, 255, 0.12) 100%); --dx: -210px; --dy: 200px; animation-duration: 30s; animation-delay: 2.8s;"></div>
      <div class="orb" style="left: 82%; top: 58%; width: 840px; height: 840px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.92), rgba(255, 135, 223, 0.82) 24%, rgba(255, 44, 191, 0.36) 58%, rgba(255, 0, 123, 0.12) 100%); --dx: -250px; --dy: -200px; animation-duration: 34s; animation-delay: 1.5s;"></div>
    </div>

    <div class="content">
      <h1>Hello, Studio</h1>
      <p>If you can read this, your workstation is alive.</p>
    </div>
  </body>
</html>
