<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello Studio</title>
    <style>
      :root {
        --bg-dark: #111111;
        --red-main: #ff2a2a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg-dark);
        color: #fff;
        text-align: center;
        font-family: Helvetica, Arial, sans-serif;
      }

      .bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }

      .orb {
        position: absolute;
        border-radius: 42% 58% 55% 45% / 46% 44% 56% 54%;
        opacity: 0.8;
        box-shadow:
          inset 0 0 40px rgba(255,255,255,0.28),
          inset 0 -20px 35px rgba(255,255,255,0.12),
          0 20px 45px rgba(0,0,0,0.18);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        animation: drift linear infinite alternate;
      }

      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(1.18) rotate(12deg);
        }
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.8rem;
      }

      h1 {
        font-family: Helvetica, Arial, sans-serif;
        color: var(--red-main);
        font-size: 2.5rem;
        margin: 0;
      }

      p {
        font-family: "Bauhaus 93", "Arial Black", sans-serif;
        font-size: 1.2rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb" style="left: 6%; top: 8%; width: 240px; height: 240px; background: linear-gradient(135deg, rgba(255, 120, 120, 0.68), rgba(255, 80, 80, 0.22)); --dx: 160px; --dy: 180px; animation-duration: 20s; animation-delay: 0s;"></div>
      <div class="orb" style="left: 18%; top: 62%; width: 210px; height: 210px; background: linear-gradient(135deg, rgba(116, 208, 255, 0.7), rgba(60, 120, 255, 0.2)); --dx: -150px; --dy: -180px; animation-duration: 23s; animation-delay: 1.2s;"></div>
      <div class="orb" style="left: 38%; top: 12%; width: 310px; height: 310px; background: linear-gradient(135deg, rgba(137, 255, 168, 0.68), rgba(25, 186, 122, 0.18)); --dx: -200px; --dy: 170px; animation-duration: 28s; animation-delay: 2.1s;"></div>
      <div class="orb" style="left: 58%; top: 54%; width: 270px; height: 270px; background: linear-gradient(135deg, rgba(255, 220, 120, 0.7), rgba(255, 160, 90, 0.18)); --dx: 170px; --dy: -200px; animation-duration: 24s; animation-delay: 0.8s;"></div>
      <div class="orb" style="left: 73%; top: 16%; width: 240px; height: 240px; background: linear-gradient(135deg, rgba(210, 150, 255, 0.7), rgba(132, 86, 255, 0.22)); --dx: -180px; --dy: 180px; animation-duration: 25s; animation-delay: 2.8s;"></div>
      <div class="orb" style="left: 82%; top: 68%; width: 290px; height: 290px; background: linear-gradient(135deg, rgba(255, 158, 220, 0.72), rgba(255, 94, 170, 0.18)); --dx: -220px; --dy: -160px; animation-duration: 30s; animation-delay: 1.5s;"></div>
    </div>

    <div class="content">
      <h1>Hello, Studio</h1>
      <p>If you can read this, your workstation is alive.</p>
    </div>
  </body>
</html>
